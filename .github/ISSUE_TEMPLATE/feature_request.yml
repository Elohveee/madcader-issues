name: Feature request
description: Suggest an idea or improvement for MadCADer.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like MadCADer to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
