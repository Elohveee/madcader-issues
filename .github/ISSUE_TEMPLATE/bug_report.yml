name: Report an issue
description: Something in MadCADer is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please don't include passwords or other private details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a model
        2. Select a beam
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 131 on macOS 15
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help explain the problem.
